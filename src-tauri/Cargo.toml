[package]
name = "app"
version = "0.1.1"
description = "Craft Post — offline postcard address and print manager"
authors = ["Toshiya Takizawa"]
license = "MIT"
repository = "https://github.com/topea-3/craft-post-app"
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
tauri = { version = "2.10.3", features = [] }
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "macros", "migrate"] }
async-trait = "0.1"
tauri-plugin-dialog = "2"
argon2 = "0.5"
aes-gcm = "0.10"
aes = "0.8"
ghash = "0.5"
sha2 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
unicode-normalization = "0.1"
getrandom = "0.2"
subtle = "2"
hex = "0.4"
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
