# Craft Post App — リリース（develop → main マージ時）
# 方針: docs/project-setup/release-workflow.md
# PR 本文フォーマット: .cursor/skills/create-release-pr/references/pr-body-template.md

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Tag, Build (Windows), GitHub Release
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Parse version and notes from PR body
        id: meta
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          VERSION=$(printf '%s\n' "$PR_BODY" | sed -n 's/^[-*][[:space:]]*\*\*Version\*\*:[[:space:]]*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::PR body から Version (X.Y.Z) を読めませんでした。create-release-pr のテンプレートを使ってください。"
            exit 1
          fi
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG は既に存在します。"
            exit 1
          fi
          NOTES=$(printf '%s\n' "$PR_BODY" | awk '
            BEGIN { p=0 }
            /^## 変更内容のサマリ[[:space:]]*$/ { p=1; next }
            /^## / { if (p) exit }
            { if (p) print }
          ')
          NOTES=$(printf '%s\n' "$NOTES" | sed -e 's/[[:space:]]*$//' | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Release ${TAG}"
          fi
          DELIM="NOTES_EOF_$(date +%s)"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "NOTES<<${DELIM}"
            printf '%s\n' "$NOTES"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
          echo "Parsed ${TAG}"

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.meta.outputs.tag }}" -m "Release ${{ steps.meta.outputs.tag }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Windows installer (.exe / NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Locate NSIS artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(find src-tauri/target/release/bundle/nsis -type f -name '*.exe' | head -n1)
          if [ -z "$EXE" ]; then
            echo "::error::NSIS .exe 成果物が見つかりません。"
            find src-tauri/target/release/bundle -type f || true
            exit 1
          fi
          echo "path=${EXE}" >> "$GITHUB_OUTPUT"
          echo "Found ${EXE}"

      - name: Create GitHub Release and upload .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Craft Post ${{ steps.meta.outputs.tag }}
          body: ${{ steps.meta.outputs.NOTES }}
          files: ${{ steps.artifact.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
